name: Deploy LLM Extractor (CF Gen + Cloud Scheduler)
run-name: "LLM Extractor deploy by ${{ github.actor }} • ${{ github.ref_name }}"

on:
  push:
    branches: [ main ]
    paths:
      - 'cloud_function/extractor-llm-poc-v2/**'
      - '.github/workflows/deploy-extractor-llm-v2.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  FUNCTION_NAME: extractor-llm-poc-v2
  FUNCTION_DIR: cloud_function/extractor-llm-poc-v2
  ENTRY_POINT: llm_extract_http
  RUNTIME: python312
  BUCKET_NAME: ${{ vars.BUCKET_NAME }}
  RUNTIME_SA: ${{ vars.RUNTIME_SA }}
  DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'vertex' }}
  LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-2.5-flash' }} 
  LLM_OVERWRITE: ${{ vars.LLM_OVERWRITE || 'false' }}
  # FIX: Changed default from 0 to 50 so it processes a safe batch size
  LLM_MAX_FILES: ${{ vars.LLM_MAX_FILES || '50' }}
  LLM_STRUCTURED_PREFIX: ${{ vars.STRUCTURED_PREFIX || 'structured_v2' }}
  
  # FIX: Updated the default JSON to match the new max_files
  SCHEDULE_BODY: ${{ vars.EXTRACTOR_LLM_BODY || '{"overwrite":false,"max_files":50}' }}
  
  # FIX: Changed from every 10 mins (*/10) to exactly once an hour at the top of the hour (0)
  CRON_EXPR: "*/10 * * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- 1. AUTHENTICATION & SETUP ---
      - name: Auth (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Ensure required APIs enabled
        run: |
          set -euo pipefail
          for API in aiplatform.googleapis.com cloudscheduler.googleapis.com artifactregistry.googleapis.com; do
            gcloud services list --enabled --filter="$API" --format="value(config.name)" | grep -q "$API" \
              || gcloud services enable "$API"
          done
          
      - name: Ensure Artifact Registry Ready (CF Gen)
        run: |
          set +e 
          gcloud artifacts repositories create cloud-functions \
            --repository-format=docker \
            --location="${REGION}" \
            --description="Cloud Functions Gen deployment repository"
          set -e 

      # --- 2. CLOUD FUNCTION DEPLOYMENT ---
      - name: Deploy Cloud Function (Gen)
        run: |
          set -euo pipefail
          SA_ARGS=()
          if [[ -n "${RUNTIME_SA:-}" ]]; then
            gcloud iam service-accounts describe "${RUNTIME_SA}" >/dev/null >&1
            SA_ARGS=(--service-account="${RUNTIME_SA}")
          fi
          
          # FIX: Added --timeout=3600 so the LLM has time to process the batch without getting killed
          gcloud functions deploy "${FUNCTION_NAME}" \
            --gen2 \
            --region="${REGION}" \
            --runtime="${RUNTIME}" \
            --source="${FUNCTION_DIR}" \
            --entry-point="${ENTRY_POINT}" \
            --trigger-http \
            --no-allow-unauthenticated \
            --memory=1024Mi \
            --timeout=3600 \
            "${SA_ARGS[@]}" \
            --set-env-vars="PROJECT_ID=${PROJECT_ID},GCS_BUCKET=${BUCKET_NAME},STRUCTURED_PREFIX=${LLM_STRUCTURED_PREFIX},LLM_PROVIDER=${LLM_PROVIDER},LLM_MODEL=${LLM_MODEL},OVERWRITE=${LLM_OVERWRITE},MAX_FILES=${LLM_MAX_FILES}"

      - name: Get Function URL
        id: cfurl
        run: |
          URL=$(gcloud functions describe "${FUNCTION_NAME}" --gen2 --region "${REGION}" --format='value(serviceConfig.uri)') 
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      # --- 3. IAM GRANTS ---
      - name: Grant invoker to deployer & runtime SAs
        run: |
          gcloud functions add-invoker-policy-binding "${FUNCTION_NAME}" \
            --gen2 --region "${REGION}" \
            --member="serviceAccount:${DEPLOYER_SA}"
          gcloud functions add-invoker-policy-binding "${FUNCTION_NAME}" \
            --gen2 --region "${REGION}" \
            --member="serviceAccount:${RUNTIME_SA}"

      - name: Grant Vertex AI user to runtime SA
        run: |
          set -euo pipefail
          if [[ -n "${RUNTIME_SA:-}" ]]; then
            gcloud projects add-iam-policy-binding "${PROJECT_ID}" \
              --member="serviceAccount:${RUNTIME_SA}" \
              --role="roles/aiplatform.user" || {
                echo "::warning:: Could not grant roles/aiplatform.user"
              }
          fi
          
      - name: Grant GCS Object Admin to runtime SA
        run: |
          set -euo pipefail
          if [[ -n "${RUNTIME_SA:-}" ]]; then
            gcloud storage buckets add-iam-policy-binding gs://${BUCKET_NAME} \
              --member="serviceAccount:${RUNTIME_SA}" \
              --role="roles/storage.objectAdmin" || {
                echo "::warning:: Could not grant roles/storage.objectAdmin"
              }
          fi
      
      # --- 4. CLOUD SCHEDULER SETUP ---
      - name: Bootstrap IAM for Scheduler OIDC
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')"
          SCHED_AGENT="service-${PROJECT_NUMBER}@gcp-sa-cloudscheduler.iam.gserviceaccount.com"

          gcloud iam service-accounts add-iam-policy-binding "${RUNTIME_SA}" \
            --member="serviceAccount:${SCHED_AGENT}" \
            --role="roles/iam.serviceAccountTokenCreator" || true

          gcloud iam service-accounts add-iam-policy-binding "${RUNTIME_SA}" \
            --member="serviceAccount:${DEPLOYER_SA}" \
            --role="roles/iam.serviceAccountUser" || true

      - name: Create/Update Cloud Scheduler job
        shell: bash
        run: |
          set -euo pipefail
          JOB_NAME="${FUNCTION_NAME}-hourly"
          URL="${{ steps.cfurl.outputs.url }}"
          [[ -z "${URL}" ]] && { echo "Function URL empty"; exit 1; }

          # FIX: Added --headers="Content-Type=application/json" so the Python script can parse the body
          if gcloud scheduler jobs describe "$JOB_NAME" --location="${REGION}" >/dev/null >&1; then
            gcloud scheduler jobs update http "$JOB_NAME" \
              --location="${REGION}" \
              --schedule="${CRON_EXPR}" \
              --time-zone="America/New_York" \
              --uri="${URL}" \
              --http-method=POST \
              --headers="Content-Type=application/json" \
              --message-body='${{ env.SCHEDULE_BODY }}' \
              --oidc-service-account-email="${RUNTIME_SA}" \
              --oidc-token-audience="${URL}"
          else
            gcloud scheduler jobs create http "$JOB_NAME" \
              --location="${REGION}" \
              --schedule="${CRON_EXPR}" \
              --time-zone="America/New_York" \
              --uri="${URL}" \
              --http-method=POST \
              --headers="Content-Type=application/json" \
              --message-body='${{ env.SCHEDULE_BODY }}' \
              --oidc-service-account-email="${RUNTIME_SA}" \
              --oidc-token-audience="${URL}"
          fi