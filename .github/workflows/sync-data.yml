name: Data Sync Hourly Predictions + Models to Repo

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  BUCKET_NAME: ${{ vars.BUCKET_NAME }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}

  GCS_BASE_PREFIX: "structured_v2/preds"
  OUTPUT_DIR: "results"

jobs:
  sync_data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Download latest run
        id: sync
        run: |
          set -e

          LATEST_RUN=$(gsutil ls -d gs://${BUCKET_NAME}/${GCS_BASE_PREFIX}/*/ | tail -1)
          RUN_ID=$(basename $LATEST_RUN)

          LOCAL_DIR=${OUTPUT_DIR}/${RUN_ID}
          mkdir -p ${LOCAL_DIR}/models

          # preds
          gsutil cp gs://${BUCKET_NAME}/${GCS_BASE_PREFIX}/${RUN_ID}/preds_*.csv ${LOCAL_DIR}/ || true

          # models
          gsutil cp gs://${BUCKET_NAME}/${GCS_BASE_PREFIX}/${RUN_ID}/models/* ${LOCAL_DIR}/models/ || true

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          RUN_ID="${{ steps.sync.outputs.run_id }}"

          git pull --rebase origin main
          git add ${OUTPUT_DIR}/${RUN_ID}
          git commit -m "sync run ${RUN_ID}" || echo "no changes"
          git push