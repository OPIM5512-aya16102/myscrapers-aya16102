name: Data Sync ALL Artifacts to Repo
run-name: Syncing all artifacts for ${{ github.ref_name }} by @${{ github.actor }}

on:
  schedule:
    - cron: '45 * * * *'   # every hour at :45
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  BUCKET_NAME: ${{ vars.BUCKET_NAME }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}

  # Root GCS path where runs live
  GCS_BASE_PREFIX: "preds"

  # Local repo folder
  OUTPUT_DIR: "results"

jobs:
  sync_data:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------
      # 1. Checkout repo
      # -----------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   
          ref: ${{ github.ref_name }} 

      # -----------------------------------
      # 2. Auth to GCP
      # -----------------------------------
      - name: Auth (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # -----------------------------------
      # 3. Find latest run + download ALL files
      # -----------------------------------
      - name: Sync latest run from GCS
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Looking for runs in GCS..."
          
          RUNS=$(gsutil ls -d gs://${BUCKET_NAME}/${GCS_BASE_PREFIX}/*/ 2>/dev/null || true)
          
          if [ -z "$RUNS" ]; then
            echo "⚠️ No runs found. Exiting cleanly."
            exit 0
          fi
          
          LATEST_RUN_DIR=$(echo "$RUNS" | sort | tail -1)
          LATEST_RUN_ID=$(echo "$LATEST_RUN_DIR" | sed -E "s|gs://${BUCKET_NAME}/${GCS_BASE_PREFIX}/||g; s|/||g")
          
          echo "✅ Latest run detected: $LATEST_RUN_ID"
          
          LOCAL_RUN_DIR="${OUTPUT_DIR}/${LATEST_RUN_ID}"
          mkdir -p "$LOCAL_RUN_DIR"
          
          echo "⬇️ Syncing ALL files from run..."
          
          gsutil -m rsync -r \
            "gs://${BUCKET_NAME}/${GCS_BASE_PREFIX}/${LATEST_RUN_ID}" \
            "$LOCAL_RUN_DIR"
            
          echo "run_id=$LATEST_RUN_ID" >> "$GITHUB_OUTPUT"

      # -----------------------------------
      # 4. Commit + push
      # -----------------------------------
      - name: Commit and Push
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          RUN_ID="${{ steps.sync.outputs.run_id }}"
          
          if [ -z "${RUN_ID}" ]; then
            echo "⚠️ No run_id found. Skipping commit."
            exit 0
          fi
          
          echo "📦 Preparing commit for run: $RUN_ID"
          
          git pull --rebase origin ${{ github.ref_name }}
          
          git add "${OUTPUT_DIR}/${RUN_ID}"
          
          # FIX: Only check for STAGED files, completely ignoring untracked credentials
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Sync: all artifacts for run ${RUN_ID}"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No new files to commit. Remote is up to date."
          fi