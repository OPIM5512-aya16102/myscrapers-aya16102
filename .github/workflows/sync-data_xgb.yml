name: Data Sync Hourly Predictions + Models to Repo
run-name: Syncing hourly artifacts for ${{ github.ref_name }} by @${{ github.actor }}

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  BUCKET_NAME: ${{ vars.BUCKET_NAME }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}

  # GCS structure
  GCS_BASE_PREFIX: "structured_v2/preds"

  # Local output folder in repo
  OUTPUT_DIR: "results"

jobs:
  sync_data:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # 1. Checkout repo
      # ---------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------
      # 2. Auth to GCP
      # ---------------------------
      - name: Auth (WIF) and Setup gcloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ---------------------------
      # 3. Find latest run + download artifacts
      # ---------------------------
      - name: Download latest predictions + models
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          echo "Finding latest run..."

          LATEST_RUN_DIR=$(gsutil ls -d gs://${BUCKET_NAME}/${GCS_BASE_PREFIX}/*/ | tail -1)

          LATEST_RUN_ID=$(echo "$LATEST_RUN_DIR" | sed -E "s|gs://${BUCKET_NAME}/${GCS_BASE_PREFIX}/||; s|/||")

          echo "Latest run_id: $LATEST_RUN_ID"

          LOCAL_RUN_DIR="${OUTPUT_DIR}/${LATEST_RUN_ID}"
          LOCAL_MODEL_DIR="${LOCAL_RUN_DIR}/models"

          mkdir -p "$LOCAL_MODEL_DIR"

          # -------------------
          # Download predictions
          # -------------------
          PRED_SRC="gs://${BUCKET_NAME}/${GCS_BASE_PREFIX}/${LATEST_RUN_ID}/preds_xgb.csv"
          PRED_DST="${LOCAL_RUN_DIR}/preds_xgb.csv"

          echo "Downloading predictions..."
          gsutil cp "$PRED_SRC" "$PRED_DST"

          # -------------------
          # Download models
          # -------------------
          MODEL_SRC="gs://${BUCKET_NAME}/${GCS_BASE_PREFIX}/${LATEST_RUN_ID}/models/xgb.joblib"

          echo "Downloading models..."
          gsutil -m cp -r "$MODEL_SRC" "$LOCAL_MODEL_DIR/" || echo "No models found for this run"

          # -------------------
          # Export outputs
          # -------------------
          echo "run_id=$LATEST_RUN_ID" >> "$GITHUB_OUTPUT"

      # ---------------------------
      # 4. Commit + push changes
      # ---------------------------
      - name: Commit and Push
        if: success()
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          RUN_ID="${{ steps.sync.outputs.run_id }}"

          echo "Staging artifacts for run $RUN_ID"

          git add results_best/$RUN_ID

          git commit -m "🤖 Sync: predictions + models for run $RUN_ID" || echo "Nothing to commit"

          git pull --rebase origin main

          git push